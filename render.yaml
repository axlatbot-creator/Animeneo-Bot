services:
  - type: web
    name: neirani-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: TOKEN
        sync: false
      - key: PORT
        value: 10000
    # MUHIM: quyidagi disk qatori faqat pullik (Starter va undan yuqori) rejalarda ishlaydi.
